<!doctype html>
<html lang="{{lang}}" data-theme="{{theme}}" data-currency="{{currency}}" data-env="{{env}}">
<head>
  <!-- @include partials/head.html -->
  <title data-i18n="meta.e500">Ошибка сервера — AMFIBIA</title>
  <link rel="stylesheet" href="/css/pages/error.css">
</head>
<body data-page="{{page}}">
  <!-- @include partials/sprite.html -->
  <!-- @include partials/overlays.html -->
  <!-- @include partials/header.html -->
  <main id="main" class="error-page error-page--500" tabindex="-1">
    <div class="error-page__code" aria-hidden="true">500</div>
    <div class="error-page__body">
      <svg class="error-page__orn icon--fill" aria-hidden="true"><use href="#orn-dagger"/></svg>
      <p class="error-page__num">ERROR · 500</p>
      <h1 class="error-page__title" data-i18n="errorPage.e500Title">Ошибка сервера</h1>
      <p class="error-page__text" data-i18n="errorPage.e500Text">Не удалось обработать запрос. Обновите страницу через несколько минут.</p>
      <div class="error-page__actions">
        <a class="btn" href="/" data-magnetic data-i18n="errorPage.toHome">На главную</a>
      </div>
    </div>
    <!-- @include partials/error-links.html -->
  </main>
  <!-- @include partials/footer.html -->
  <script type="module" src="/js/pages/static.js"></script>
</body>
</html>
