<!doctype html>
<html lang="{{lang}}" data-theme="{{theme}}" data-currency="{{currency}}" data-env="{{env}}">
<head>
  <!-- @include partials/head.html -->
  <title data-i18n="meta.catalog">Каталог — AMFIBIA</title>
  <link rel="stylesheet" href="/css/pages/catalog.css">
</head>
<body data-page="{{page}}">
  <!-- @include partials/sprite.html -->
  <!-- @include partials/overlays.html -->
  <!-- @include partials/header.html -->
  <main id="main" class="page catalog-page" tabindex="-1">
    <section class="catalog-hero">
      <div class="catalog-hero__bg" aria-hidden="true" data-parallax="0.18" data-catalog-bg>Catalogue</div>
      <nav class="breadcrumbs" data-breadcrumbs data-i18n-attr="aria-label:a11y.breadcrumbs" aria-label="Навигационная цепочка"></nav>
      <div class="catalog-hero__row">
        <div>
          <p class="t-eyebrow" data-catalog-eyebrow>Amfibia — 15 maisons</p>
          <h1 class="catalog-hero__title" data-catalog-title data-i18n="catalog.title">Каталог</h1>
        </div>
        <p class="catalog-hero__count t-mono" data-catalog-count></p>
      </div>
    </section>
    <!-- @include partials/catalog.html -->
  </main>
  <!-- @include partials/footer.html -->
  <script type="module" src="/js/pages/catalog.js"></script>
</body>
</html>
