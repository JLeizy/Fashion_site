<style>
  body { margin: 0; font: 12px/1.45 Inter, system-ui, sans-serif; color: #1e1e1e; background: #fff; }
  .wrap { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 16px 8px; border-bottom: 1px solid #e6e6e6; }
  header b { font-size: 13px; }
  #state { color: #666; margin-top: 2px; }
  #log { flex: 1; overflow: auto; padding: 8px 16px; white-space: pre-wrap; }
  #log .h { font-weight: 600; margin-top: 10px; }
  #log .ok { color: #0a7f3f; }
  #log .warn { color: #b25e00; }
  #log .err { color: #c4171b; }
  #log .dim { color: #777; }
  footer { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid #e6e6e6; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  button.main { background: #0d99ff; color: #fff; border-color: #0d99ff; }
  button:disabled { opacity: .5; cursor: default; }
</style>
<div class="wrap">
  <header><b>Мультивселенная — стили и переходы</b><div id="state">Работаю… Не закрывай это окно.</div></header>
  <div id="log"></div>
  <footer><button id="copy" disabled>Скопировать отчёт</button><span style="flex:1"></span><button id="close" class="main" disabled>Закрыть</button></footer>
</div>
<script>
  const log = document.getElementById('log');
  const plain = [];
  function add(text, cls) {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    plain.push(text);
  }
  // сравнение двух PNG пиксель в пиксель
  async function decode(bytes) {
    const bmp = await createImageBitmap(new Blob([bytes], { type: 'image/png' }));
    const c = document.createElement('canvas');
    c.width = bmp.width; c.height = bmp.height;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bmp, 0, 0);
    const data = ctx.getImageData(0, 0, c.width, c.height).data;
    if (bmp.close) bmp.close();
    return { w: c.width, h: c.height, data };
  }
  async function compare(a, b) {
    if (a.length === b.length) {
      let same = true;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) { same = false; break; }
      if (same) return { same: true, changed: 0, max: 0 };
    }
    const A = await decode(a), B = await decode(b);
    if (A.w !== B.w || A.h !== B.h) return { same: false, changed: A.w * A.h, max: 255, size: true };
    let changed = 0, max = 0, x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    for (let i = 0; i < A.data.length; i += 4) {
      const d = Math.max(Math.abs(A.data[i] - B.data[i]), Math.abs(A.data[i + 1] - B.data[i + 1]), Math.abs(A.data[i + 2] - B.data[i + 2]), Math.abs(A.data[i + 3] - B.data[i + 3]));
      if (d > max) max = d;
      if (d > 10) {
        changed++;
        const p = i / 4, x = p % A.w, y = (p - x) / A.w;
        if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y;
      }
    }
    return { same: changed === 0, changed, max, box: changed ? [x0, y0, x1, y1] : null };
  }
  onmessage = async (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === 'log') add(m.text, m.cls);
    if (m.type === 'state') document.getElementById('state').textContent = m.text;
    if (m.type === 'done') {
      document.getElementById('state').textContent = m.text;
      document.getElementById('copy').disabled = false;
      document.getElementById('close').disabled = false;
    }
    if (m.type === 'compare') {
      let res;
      try { res = await compare(m.a, m.b); } catch (err) { res = { error: String(err && err.message || err) }; }
      parent.postMessage({ pluginMessage: Object.assign({ type: 'compared', id: m.id }, res) }, '*');
    }
  };
  document.getElementById('close').onclick = () => parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
  document.getElementById('copy').onclick = () => {
    const ta = document.createElement('textarea');
    ta.value = plain.join('\n');
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); add('Отчёт скопирован.', 'dim'); } catch (e) {}
    ta.remove();
  };
  parent.postMessage({ pluginMessage: { type: 'ready' } }, '*');
</script>
